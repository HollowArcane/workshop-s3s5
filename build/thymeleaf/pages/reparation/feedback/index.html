<div th:fragment="content" class="container">
    <form action="" class="card mb-5 mt-5" method="get">
        <div class="card-body p-5">
            <h3> Recherche </h3>
            <div class="mb-3">
                <label for="idModelCategory">Catégorie de modèle</label>
                <select class="form-select" name="idModelCategory" id="idModelCategory">
                    <option value="">Tous</option>
                    <option th:each="value : ${selectValues1}" th:value="${value.id}" th:text="${value.label}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="idComponentCategory">Catégorie de pièce</label>
                <select class="form-select" name="idComponentCategory" id="idComponentCategory">
                    <option value="">Tous</option>
                    <option th:each="value : ${selectValues2}" th:value="${value.id}" th:text="${value.label}"></option>
                </select>
            </div>
            <input type="submit" class="btn btn-primary" value="Valider">
        </div>
    </form>

    <div th:insert="/includes/message :: message"></div>

    <h1 class="d-flex gap-3 align-items-center">
        <a class="btn btn-primary" href="/reparation/feedback/create"><i class="fa fa-add"></i></a>
        Liste des Retours
    </h1>
    
    <table class="table table-striped fx__table">
        <thead>
            <th> Numéro de Série </th>
            <th> Catégorie du Modèle </th>
            <th> Catégorie de la Pièce </th>
            <th> Prix de la Réparation </th>
            <th> Date de Retour </th>
        </thead>
        <tbody>
            <tr th:each="reparation : ${data}">
                <td th:text="${reparation.serialNumber}"></td>
                <td th:text="${reparation.modelCategoryLabel}"></td>
                <td th:text="${reparation.componentCategoryLabel}"></td>
                <td th:text="${reparation.price}"></td>
                <td th:text="${reparation.feedbackDate}"></td>
            </tr>
        </tbody>
    </table>

    <div th:insert="/components/pagination::pagination(body=~{::paginationBody})">
        <th:block th:fragment="paginationBody">
            <li class="page-item" th:each="spread : ${pagination}">
                <a th:href="'?page='+${spread}" th:class="'page-link '+(${spread == '...'} ? 'disabled': '')+(${spread == paginationPage} ? 'active': '')" th:text="${spread}"></a>
            </li>
        </th:block>
    </div>
</div>
