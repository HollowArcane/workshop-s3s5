<div th:fragment="content" class="container mt-5">
    <h1 class="d-flex gap-1 align-items-center mb-3">
        <button id="btn-add" type="button" class="btn btn-primary" data-mdb-ripple-init data-mdb-modal-init data-mdb-target="#modal">
            <i class="fa fa-add"></i>
        </button>
        Liste des Tiquets de Réparation
    </h1>
    
    <div th:replace="~{/components/modal :: modal(name='modal', title='', body=~{:: modalBody})}">
        <div th:fragment="modalBody">
            <form id="form">
                <h1 th:text="${formTitle}"></h1>
                
                <div th:replace="~{/components/form :: select('idCustomer', '', ${customers}, 'Client')}"></div>
                <div th:replace="~{/components/form :: select('idModel', '', ${models}, 'Modèle')}"></div>
                
                <div th:replace="~{/components/form :: input('dateStart', '', 'datetime-local', 'Date de Dépôt')}"></div>
                <div th:replace="~{/components/form :: input('diagnostic', '', 'text', 'Diagnostic')}"></div>
                <div th:replace="~{/components/form :: input('priceReparation', '', 'number', 'Prix de Réparation')}"></div>

                <button class="btn btn-primary"> Valider </button>
            </form>
        </div>
    </div>

    <table id="table" class="table table-striped fx__table">
        <thead>
            <th> </th>
            <th> Modèle </th>
            <th> Nº de Série </th>
            <th> Marque </th>
            <th> Diagnostic </th>
            <th> Prix </th>
            <th> Date de Dépôt </th>
            <th> Date de Retour </th>
            <th> Client </th>
            <th> Contact </th>
        </thead>
        <tbody>
            <!-- rendered using js -->
        </tbody>
    </table>

    <div th:replace="~{/components/pagination :: pagination}"></div>
    <script defer type="text/javascript" src="/assets/src/js/ticket/ticket/index.js"></script>
</div>
