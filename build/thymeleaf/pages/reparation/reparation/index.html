<div th:fragment="content">
    <form action="" class="card mb-5" method="get">
        <div class="card-body p-3">
            <div>
                <label for="idComponentCategory">Catégorie de pièce</label>
                <select class="form-select" name="idComponentCategory" id="idComponentCategory">
                    <option th:each="value : ${selectValues}" th:value="${value.id}" th:text="${value.label}"></option>
                </select>
            </div>
            <input type="submit" class="btn btn-primary" value="Valider">
        </div>
    </form>
    <h1>Liste des réparation</h1>
    <table class="table table-striped table-hover">
        <thead>
            <th> Date de réparation </th>
            <th> Modèle </th>
            <th> Prix </th>
            <th>  </th>
        </thead>
        <tbody>
            <tr th:each="reparation : ${data}">
                <td th:text="${reparation.date}"></td>
                <td th:text="${reparation.idModel}"></td>
                <td th:text="${reparation.price}"></td>
                <td></td>
            </tr>
        </tbody>
    </table>
</div>
